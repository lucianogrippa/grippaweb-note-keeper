<form class="group-form card" #form="ngForm">
  <div class="form-group">
    <input
      class="input"
      type="text"
      [value]="groupData()?.name"
      (input)="updateNewGroupName($event)"
      name="name"
      placeholder="Group name"
      required
      #nameInput
    />
  </div>
  <div class="form-actions">
    <button type="button" class="btn btn-primary" (click)="saveData()" [disabled]="!form.valid">
      Save
    </button>
    <button type="button" class="btn btn-secondary" (click)="cancelForm()">
      Cancel
    </button>
  </div>
</form>
