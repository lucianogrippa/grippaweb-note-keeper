name: note_keeper
description: "Keep your notes safe and secure with Note Keeper, All data are stored in local device in secure storage and not shared to any other server or cloud storage. Note Keeper is a simple and easy to use note taking app that allows you to create, edit and delete notes. You can also set a password to protect your notes."
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.5+1
  go_router: ^18.0.1

  flutter_secure_storage: ^11.2.0
  argon2: ^1.0.1
  uuid: ^4.6.0
  crypto: ^3.0.7
  dart_jsonwebtoken: ^3.1.1
  email_validator: ^3.0.0
  path: any
  path_provider: ^2.1.6
  material_ui: ^1.6.0
  flutter_riverpod: ^3.4.3

  hive_ce: any
  hive_ce_flutter: any

dev_dependencies:
  flutter_test:
    sdk: flutter

  hive_ce_generator: any

  flutter_lints: ^6.0.0
  build_runner: any

flutter:
  uses-material-design: true
